[project]
name = "simplepythoncalculator"
version = "0.1.0"
description = "A simple calculator written in python."
authors = [
    {name = "fReschPerspectives",email = "fresch.perspectives@outlook.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "debugpy",
    "pytest-xvfb (>=3.0.0,<4.0.0)",
    "pytest-timeout (>=2.3.1,<3.0.0)"
]

[pytest]
time = 10 # Set timeout to 10 seconds